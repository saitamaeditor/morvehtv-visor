<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MorvehTV</title>
<meta name="theme-color" content="#0f1115">
<!-- Para añadirla a la pantalla de inicio del móvil como si fuera una app -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MorvehTV">
<script src="polyfills.js"></script>
<style>
  :root {
    --fondo: #0f1115; --panel: #171a21; --panel2: #1f232c; --borde: #2a2f3a;
    --texto: #e7e9ee; --suave: #9aa1ad; --acento: #4f8cff; --peligro: #ff6b6b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
  button, input, select { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--borde); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .logo small { color: var(--suave); font-weight: 400; }
  .logo .tv { background: linear-gradient(135deg, #4f8cff, #8e4ec6 50%, #d6409f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #migas { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; flex: 1; min-width: 200px; }
  #migas a { color: var(--texto); text-decoration: none; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
  #migas a:hover { background: var(--panel2); }
  #migas span { color: var(--suave); }
  select { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 10px; }
  .boton { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 10px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--texto); display: inline-flex; gap: 6px; align-items: center; }
  .boton:hover { border-color: var(--acento); }
  .boton.activo { background: var(--acento); border-color: var(--acento); color: #fff; }
  main { padding: 16px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .item { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .item:hover { border-color: var(--acento); }
  .item { position: relative; }
  .item .nuevo { position: absolute; top: 6px; left: 6px; z-index: 1; background: var(--acento); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .lista .item .nuevo { top: 2px; left: 2px; font-size: 9px; padding: 1px 4px; }
  #directo { font-size: 12px; color: var(--suave); display: inline-flex; gap: 5px; align-items: center; }
  #directo::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--suave); }
  #directo.vivo::before { background: #30a46c; box-shadow: 0 0 6px #30a46c; }
  .item .mini { aspect-ratio: 4/3; display: grid; place-items: center; background: var(--panel2); font-size: 40px; overflow: hidden; }
  .item .mini img { width: 100%; height: 100%; object-fit: cover; }
  .item .nombre { padding: 8px; word-break: break-word; font-size: 13px; }
  .item .meta { padding: 0 8px 8px; color: var(--suave); font-size: 12px; }
  .lista .item { flex-direction: row; align-items: center; }
  .lista { display: flex; flex-direction: column; gap: 4px; }
  .lista .item .mini { width: 44px; aspect-ratio: 1; font-size: 22px; flex: none; }
  .lista .item .nombre { flex: 1; }
  .lista .item .meta { padding: 0 12px; white-space: nowrap; }
  .vacio { color: var(--suave); padding: 40px; text-align: center; }
  .error { color: var(--peligro); }
  #mas { margin: 16px auto; display: block; }
  /* Vista previa */
  #visor { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.92); z-index: 10; display: none; flex-direction: column; }
  #visor.abierto { display: flex; }
  #visor .barra { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--borde); flex-wrap: wrap; }
  #visor .titulo { flex: 1; min-width: 150px; word-break: break-all; }
  #visor .contenido { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 16px; overflow: auto; padding: 16px; position: relative; }
  #visor .contenido > video, #visor .contenido > img { max-width: 100%; max-height: calc(100vh - 110px); }
  #visor .contenido > video { max-height: 68vh; }
  #visor iframe { width: 100%; height: calc(100vh - 110px); border: 0; background: #fff; }
  #visor pre { white-space: pre-wrap; word-break: break-word; background: var(--panel); padding: 16px; border-radius: 8px; max-width: 1000px; width: 100%; margin: 0; align-self: start; }
  #visor audio { width: min(600px, 100%); }
  .flecha { position: absolute; top: 50%; transform: translateY(-50%); font-size: 28px; background: rgba(0,0,0,.5); border: 0; color: #fff; width: 44px; height: 64px; cursor: pointer; border-radius: 8px; }
  .flecha:hover { background: rgba(79,140,255,.6); }
  #ant { left: 8px; } #sig { right: 8px; }
  .categorias { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .lista .categorias { margin-bottom: 8px; }
  .cat { --c: var(--acento); border-radius: 14px; padding: 18px; cursor: pointer; border: 1px solid var(--borde);
    background: linear-gradient(135deg, color-mix(in srgb, var(--c) 35%, var(--panel)), var(--panel) 70%); transition: transform .12s, border-color .12s; }
  .cat:hover { transform: translateY(-2px); border-color: var(--c); }
  .cat .icono { font-size: 34px; }
  .cat .nombre { font-size: 17px; font-weight: 700; margin-top: 8px; }
  .cat .meta { color: var(--suave); font-size: 12px; margin-top: 4px; }
  /* Con imagen: el fondo de un título de la categoría, teñido con su color para leer bien */
  .cat { position: relative; overflow: hidden; isolation: isolate; min-height: 150px; }
  .cat::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; opacity: 0;
    background: var(--img) center / cover no-repeat; transition: opacity .6s ease, transform 6s ease; }
  .cat::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; opacity: 0; transition: opacity .6s ease;
    background: linear-gradient(100deg, rgba(10,12,16,.9) 15%, rgba(10,12,16,.5) 55%, rgba(10,12,16,.1)),
      linear-gradient(to top, var(--c), transparent 65%); }
  .cat.con-imagen::before, .cat.con-imagen::after { opacity: 1; }
  .cat.con-imagen { background: linear-gradient(135deg, var(--c), var(--panel) 75%); border-color: rgba(255,255,255,.08); }
  .cat.con-imagen::before { mix-blend-mode: normal; }
  .cat.con-imagen:hover::before, .cat.con-imagen:focus::before { transform: scale(1.08); }
  .cat.con-imagen .nombre { font-size: 20px; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .cat.con-imagen .meta { color: #d5d9e2; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  .cat.con-imagen .icono { filter: drop-shadow(0 2px 8px rgba(0,0,0,.7)); }
  /* Franja del color de la categoría a la izquierda */
  .cat.con-imagen { box-shadow: inset 4px 0 0 var(--c); }
  .cat.vacia { opacity: .4; cursor: default; }
  .cat.vacia.con-imagen { opacity: .55; filter: grayscale(.6); }
  .cat.vacia:hover { transform: none; border-color: var(--borde); }
  .seccion { grid-column: 1 / -1; font-size: 15px; color: var(--suave); margin: 16px 0 0; font-weight: 600; }
  .repro { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 1400px; background: #000; }
  .repro video { width: 100%; max-height: 62vh; cursor: pointer; }
  .repro:fullscreen video { max-height: calc(100vh - 56px); flex: 1; }
  .controles { display: flex; gap: 8px; align-items: center; padding: 8px; background: var(--panel); flex-wrap: wrap; }
  .controles input[type=range] { flex: 1; min-width: 140px; accent-color: var(--acento); }
  .controles .tiempo { color: var(--suave); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .controles select { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 6px; }
  /* ---------- Modo cine: el vídeo ocupa toda la pantalla ---------- */
  #salircine { display: none; }
  #visor.cine { background: #000; }
  #visor.cine .barra { position: fixed; top: 0; left: 0; right: 0; z-index: 3; background: linear-gradient(rgba(0,0,0,.8), transparent);
    border: 0; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left)); transition: opacity .3s; }
  #visor.cine .barra > * { display: none; }
  #visor.cine .barra #salircine, #visor.cine .barra #vtitulo { display: inline-flex; }
  #visor.cine #salircine { order: -1; }
  #visor.cine #vtitulo { flex: 1; text-shadow: 0 1px 4px #000; word-break: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #visor.cine .flecha, #visor.cine .ficha { display: none !important; }
  #visor.cine .contenido { padding: 0; overflow: hidden; justify-content: center; }
  #visor.cine .repro { position: fixed; top: 0; left: 0; right: 0; bottom: 0; max-width: none; z-index: 1; }
  #visor.cine .repro video, #visor.cine .contenido > video {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; max-height: none; object-fit: contain; background: #000; }
  #visor.cine .controles {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; border: 0; transition: opacity .3s;
    background: linear-gradient(transparent, rgba(0,0,0,.88));
    padding: 36px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #visor.cine .controles .boton, #visor.cine .controles select { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); }
  #visor.cine .controles .tiempo { color: #e7e9ee; }
  #visor.cine .cargando { position: fixed; top: calc(50% + 78px); left: 50%; transform: translate(-50%, -50%); font-size: 18px; padding: 10px 16px; z-index: 2; }
  /* Viendo el vídeo, a los 3 s se esconden solos los botones, la barra de progreso y la barra
     de arriba; vuelven al tocar la pantalla, mover el ratón o pulsar el mando */
  #visor.cine.reposo .controles, #visor.cine.reposo .barra { opacity: 0; }
  #visor.cine.reposo .controles *, #visor.cine.reposo .barra * { pointer-events: none; }
  #visor.cine.reposo video { cursor: none; }
  /* Botones agrupados a la izquierda; la barra de progreso ocupa el resto */
  .controles { justify-content: flex-start; }
  .tele #visor.cine .controles .boton { font-size: 24px; }
  /* ▶ grande en el centro mientras el vídeo está en pausa */
  .gran-play {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 2;
    width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); cursor: pointer;
    background: rgba(10,12,16,.55); color: #fff; font-size: 34px; line-height: 1; padding-left: 6px;
    box-shadow: 0 6px 30px rgba(0,0,0,.6); transition: transform .15s, background .15s;
  }
  .gran-play:hover, .gran-play:focus { background: rgba(79,140,255,.75); transform: translate(-50%, -50%) scale(1.06); outline: none; }
  #visor.cine .gran-play { position: fixed; top: 50%; }
  .tele .gran-play { width: 110px; height: 110px; font-size: 44px; }
  .cargando { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.7); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
  /* Metadatos */
  .item .mini.cartel { aspect-ratio: 2/3; }
  .item .mini.ancha { aspect-ratio: 16/9; }
  .lista .item .mini.cartel, .lista .item .mini.ancha { aspect-ratio: 1; }
  #cabecera { border-radius: 14px; margin-bottom: 16px; background-size: cover; background-position: center; border: 1px solid var(--borde); }
  .ficha { display: flex; gap: 20px; width: 100%; max-width: 1400px; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; text-align: left; }
  #cabecera .ficha { background: transparent; border: 0; }
  .ficha img.cartel { width: 170px; height: auto; max-height: none; border-radius: 8px; align-self: flex-start; flex: none; }
  .ficha .cuerpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .ficha h2 { margin: 0; font-size: 22px; }
  .ficha h3 { margin: 6px 0 0; font-size: 16px; }
  .ficha p { margin: 0; line-height: 1.55; max-width: 80ch; }
  .suave { color: var(--suave); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { background: var(--panel2); border: 1px solid var(--borde); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .linea { font-size: 13px; }
  .tecnico { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--suave); border-top: 1px solid var(--borde); padding-top: 8px; word-break: break-all; }
  .corrector input { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 10px; flex: 1; min-width: 140px; }
  .corrector summary { cursor: pointer; color: var(--suave); font-size: 13px; }
  .corrector .chips { margin-top: 8px; }
  .resultados { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; margin-top: 8px; }
  .resultado { display: flex; gap: 8px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 6px; cursor: pointer; }
  .resultado:hover { border-color: var(--acento); }
  .resultado img { width: 40px; border-radius: 4px; }
  /* ---------- Mando de la tele ---------- */
  .item:focus, .cat:focus, .boton:focus, #migas a:focus, select:focus, input:focus, summary:focus, .flecha:focus, #vcontenido > video:focus {
    outline: 3px solid var(--acento); outline-offset: 2px;
  }
  html:not(.usa-mando):not(.tele) .item:focus:not(:focus-visible), html:not(.usa-mando):not(.tele) .cat:focus:not(:focus-visible),
  html:not(.usa-mando):not(.tele) .boton:focus:not(:focus-visible) { outline: none; }
  .tele body, .usa-mando body { scroll-behavior: smooth; }
  .tele .item:focus, .tele .cat:focus { transform: scale(1.06); box-shadow: 0 10px 30px rgba(79,140,255,.45); z-index: 2; }
  .item, .cat { transition: transform .12s, box-shadow .12s, border-color .12s; }
  /* En la tele todo más grande: se ve desde el sofá */
  .tele body { font-size: 20px; }
  .tele header { padding: 16px 40px; }
  .tele main { padding: 24px 40px; }
  .tele .rejilla { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
  .tele .categorias { grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .tele .cat { padding: 26px; }
  .tele .cat .nombre { font-size: 24px; }
  .tele .item .nombre { font-size: 18px; }
  .tele .item .meta, .tele .cat .meta { font-size: 15px; }
  .tele .boton, .tele select { padding: 10px 16px; }
  .tele .controles .boton { padding: 12px 20px; font-size: 22px; }
  /* ---------- Móvil y tablet (táctil) ---------- */
  @media (pointer: coarse) {
    .boton, select { min-height: 42px; }
    .controles .boton { min-width: 48px; justify-content: center; }
    .controles input[type=range] { height: 32px; }
    .flecha { width: 40px; height: 56px; }
  }
  body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  #visor .barra { padding-top: max(10px, env(safe-area-inset-top)); }
  /* Navegadores antiguos (teles de 2017-2020): sin color-mix ni aspect-ratio */
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    .cat { background: var(--panel); border-top: 4px solid var(--c); }
  }
  @supports not (aspect-ratio: 1) {
    .item .mini { height: 120px; }
    .item .mini.cartel { height: 260px; }
    .tele .item .mini.cartel { height: 340px; }
  }
  .aviso { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--acento); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 20; display: none; }
  @media (max-width: 600px) {
    /* Cabecera compacta (logo y ruta). No se queda fija al bajar, para dejar la pantalla al contenido. */
    header { position: static; padding: 10px 12px; gap: 8px; }
    #migas { min-width: 0; flex-basis: 100%; order: 2; }
    .txt { display: none; }
    main { padding: 12px; }
    .rejilla { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .item .nombre { font-size: 13px; padding: 7px 8px 4px; }
    .item .meta { padding: 0 8px 8px; font-size: 11.5px; }
    .item .meta .fecha { display: none; }
    .lista .item .meta { display: none; }
    .categorias { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .cat { padding: 14px; min-height: 118px; }
    .cat .icono { font-size: 26px; }
    .cat .nombre, .cat.con-imagen .nombre { font-size: 16px; margin-top: 6px; }
    .cat .meta { font-size: 11.5px; }
    /* Visor: una sola fila con el título recortado y la ✕ siempre a la vista */
    #visor .barra { flex-wrap: nowrap; padding: 8px 10px; gap: 8px; }
    #visor .titulo { min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; word-break: normal; }
    #vmeta { display: none; }
    #visor .contenido { padding: 10px; }
    #visor:not(.cine) .flecha { display: none; }
    .ficha { flex-direction: column; padding: 14px; }
    .ficha img.cartel { width: 120px; }
    .ficha h2 { font-size: 20px; }
  }
  /* Controles del reproductor en pantallas estrechas: la barra de progreso arriba, a lo
     ancho, y los botones debajo en una fila (el volumen lo llevan los botones del móvil) */
  @media (max-width: 700px) {
    .controles { gap: 6px; padding: 8px 10px; justify-content: flex-start; }
    .controles input[type=range] { order: -2; flex: 1 1 100%; min-width: 0; margin: 0; }
    .controles .tiempo { order: -1; flex: 1 1 100%; text-align: right; font-size: 12px; margin-top: -2px; }
    .controles .boton { padding: 8px 12px; }
    .controles select { max-width: 120px; }
  }
  @media (max-width: 700px) and (pointer: coarse) {
    .controles .sonido { display: none; }
  }
  /* ================= Estilo de plataforma de streaming =================
     Fondo casi negro, barra de arriba transparente sobre el destacado, carátulas sin marcos
     y filas que se desplazan en horizontal. Los colores de marca siguen siendo los de MorvehTV. */
  :root { --fondo: #0b0b0f; --panel: #16161d; --panel2: #23232c; --borde: #2c2c36; --margen: 4vw; --ancho-cartel: 158px; }
  body { background: var(--fondo); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 76px var(--margen) 40px; }
  body.en-inicio main { padding-top: 0; }

  /* Barra de arriba */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 6; border: 0; gap: 22px; flex-wrap: nowrap;
    padding: 14px var(--margen); background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); transition: background .35s;
  }
  header.solida, body:not(.en-inicio) header { background: rgba(11,11,15,.97); box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: .02em; color: #fff; text-decoration: none; white-space: nowrap; }
  #nav { display: flex; gap: 18px; align-items: center; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #nav::-webkit-scrollbar { display: none; }
  #nav a { color: #d6d6dc; text-decoration: none; font-size: 14px; white-space: nowrap; transition: color .2s; padding: 4px 0; }
  #nav a:hover { color: #fff; }
  #nav a.activo { color: #fff; font-weight: 700; }
  #nav a.vacia:not(.activo) { color: #8a8a96; }
  /* Fila de una categoría sin contenido todavía */
  .proximamente {
    flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 120px;
    padding: 18px 24px; border-radius: 6px; border: 1px dashed #34343f; color: #9a9aa6; font-size: 14px;
    background: linear-gradient(135deg, rgba(79,140,255,.07), rgba(214,64,159,.05));
  }
  .proximamente strong { color: #d8d8e0; font-size: 16px; letter-spacing: .02em; }
  .fila.vacia .fila-titulo a { color: #a8a8b4; }
  #vcontenido .ver-nativo { align-self: flex-start; margin: 6px 0 2px; }
  .rejilla > .vacio { grid-column: 1 / -1; max-width: 560px; text-align: left; padding: 22px 26px; border-radius: 8px;
    border: 1px dashed #34343f; background: linear-gradient(135deg, rgba(79,140,255,.07), rgba(214,64,159,.05)); line-height: 1.6; }
  .rejilla > .vacio strong { color: #e0e0e8; font-size: 18px; }
  .tele .proximamente { min-height: 170px; font-size: 18px; }
  #directo { flex: none; }
  #migas { margin: 4px 0 14px; flex: none; min-width: 0; }

  /* Destacado */
  .portada { display: block; }
  .heroe {
    position: relative; margin: 0 calc(var(--margen) * -1); min-height: 78vh; display: flex; align-items: flex-end;
    padding: 0 var(--margen) 9vh; overflow: hidden; background: #000;
  }
  .heroe-imagen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; transition: opacity .9s ease;
    background: var(--fondo-heroe) center 20% / cover no-repeat;
  }
  .heroe.con-imagen .heroe-imagen { opacity: 1; }
  .heroe::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
    background: linear-gradient(77deg, rgba(0,0,0,.88) 0, rgba(0,0,0,.45) 42%, rgba(0,0,0,0) 70%),
      linear-gradient(0deg, var(--fondo) 0, rgba(11,11,15,.6) 14%, rgba(11,11,15,0) 38%);
  }
  .heroe-info { position: relative; z-index: 1; max-width: 600px; }
  .heroe-tipo { color: #c9b8ff; font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  .heroe h1 { margin: 8px 0 10px; font-size: 52px; font-size: clamp(30px, 4.8vw, 70px); font-weight: 900; line-height: 1.02; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
  .heroe-datos { color: #e3e3e8; font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .heroe-sinopsis { margin: 0 0 20px; font-size: 16px; line-height: 1.45; color: #ececf1; text-shadow: 0 1px 8px rgba(0,0,0,.7);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .heroe-botones { display: flex; gap: 12px; flex-wrap: wrap; }
  .boton-blanco, .boton-gris { border: 0; border-radius: 6px; padding: 11px 26px; font-size: 17px; font-weight: 700; }
  .boton-blanco { background: #fff; color: #000; }
  .boton-blanco:hover, .boton-blanco:focus { background: rgba(255,255,255,.78); }
  .boton-gris { background: rgba(109,109,118,.62); color: #fff; }
  .boton-gris:hover, .boton-gris:focus { background: rgba(109,109,118,.42); }

  /* Filas */
  .filas { position: relative; z-index: 1; margin-top: -4vh; }
  .fila { margin: 0 0 28px; }
  .fila-titulo { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
  .fila-titulo a { color: #ececf1; text-decoration: none; display: inline-flex; align-items: baseline; gap: 10px; }
  .ver-todo { font-size: 13px; font-weight: 700; color: #8fb4ff; opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .25s; }
  .fila-titulo a:hover .ver-todo, .fila-titulo a:focus .ver-todo { opacity: 1; transform: none; }
  .carrusel {
    display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scroll-behavior: smooth;
    margin: 0 calc(var(--margen) * -1); padding: 8px var(--margen) 18px; scroll-padding: 0 var(--margen); scrollbar-width: none;
  }
  .carrusel::-webkit-scrollbar { display: none; }
  .carrusel .item { flex: 0 0 var(--ancho-cartel); scroll-snap-align: start; }

  /* Carátulas (filas y cuadrícula) */
  .item { background: none; border: 0; border-radius: 6px; overflow: visible; transition: transform .2s ease, box-shadow .2s ease; }
  .item:hover { border-color: transparent; }
  .item .mini { border-radius: 6px; background: linear-gradient(145deg, #1d1d26, #121218); position: relative; }
  .item .mini.cartel { aspect-ratio: 2/3; }
  .item .mini.ancha { aspect-ratio: 16/9; }
  .item .mini img { opacity: 1; }
  .item .mini .provisional { padding: 10px; font-size: 13px; font-weight: 700; color: #b8b8c4; text-align: center; word-break: break-word; }
  .item .nombre { padding: 7px 2px 0; font-size: 13px; font-weight: 600; color: #dcdce2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { padding: 2px 2px 0; font-size: 12px; color: #8d8d99; }
  .item .meta:empty { display: none; }
  .item .nuevo { top: 6px; left: 6px; background: linear-gradient(135deg, #4f8cff, #8e4ec6 55%, #d6409f); border-radius: 3px; font-size: 10px; letter-spacing: .06em; padding: 3px 6px; }
  @media (hover: hover) and (pointer: fine) {
    .item:hover { transform: scale(1.06); z-index: 3; }
    .item:hover .mini { box-shadow: 0 10px 28px rgba(0,0,0,.7); }
  }
  .item:focus { outline: none; }
  .item:focus .mini { box-shadow: 0 0 0 3px #fff, 0 10px 28px rgba(0,0,0,.7); }
  .tele .item:focus { transform: scale(1.08); box-shadow: none; }
  .rejilla { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 12px; }
  .pagina-titulo { grid-column: 1 / -1; margin: 6px 0 4px; font-size: 32px; font-weight: 900; }

  /* Episodios en lista: imagen, número, título, duración y sinopsis */
  .rejilla.episodios { grid-template-columns: 1fr; gap: 0; max-width: 1100px; }
  .episodios .item { flex-direction: row; align-items: flex-start; gap: 18px; padding: 16px 10px; border-bottom: 1px solid #22222a; border-radius: 0; }
  .episodios .item:hover { transform: none; background: #15151c; }
  .episodios .item .mini { width: 240px; flex: none; }
  .episodios .item .nombre { font-size: 16px; padding: 4px 0 0; white-space: normal; flex: 1; }
  .episodios .item { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: auto auto 1fr; column-gap: 18px; }
  .episodios .item .mini { grid-row: 1 / span 3; }
  .episodios .item .meta { padding: 4px 0 0; }
  .episodios .item .sinopsis { margin: 6px 0 0; color: #a9a9b4; font-size: 13.5px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* Cabecera de serie a lo ancho, como el destacado */
  #cabecera { margin: -76px calc(var(--margen) * -1) 18px; border: 0; border-radius: 0; padding: 90px var(--margen) 30px; background-size: cover; background-position: center 20%; }
  #cabecera .ficha h2 { font-size: 38px; font-weight: 900; }

  /* Visor y ficha con el mismo tono */
  #visor { background: rgba(0,0,0,.96); }
  .ficha { background: #15151c; border-color: #23232c; }

  @media (max-width: 600px) {
    :root { --margen: 14px; --ancho-cartel: 112px; }
    main { padding-top: 96px; }
    header { flex-wrap: wrap; row-gap: 6px; padding: 10px var(--margen) 8px; }
    .logo { font-size: 19px; }
    #nav { order: 3; flex-basis: 100%; gap: 16px; }
    #nav a { font-size: 13.5px; }
    .heroe { min-height: 70vh; padding-bottom: 7vh; }
    .heroe-sinopsis { font-size: 14px; -webkit-line-clamp: 3; }
    .heroe-datos { font-size: 13px; }
    .boton-blanco, .boton-gris { padding: 10px 18px; font-size: 15px; flex: 1; justify-content: center; }
    .fila-titulo { font-size: 17px; }
    .ver-todo { opacity: 1; transform: none; }
    .rejilla { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 8px; }
    .episodios .item { grid-template-columns: 132px 1fr; column-gap: 12px; padding: 12px 0; }
    .episodios .item .mini { width: 132px; }
    .episodios .item .nombre { font-size: 14px; }
    .episodios .item .sinopsis { grid-column: 1 / -1; font-size: 13px; }
    .pagina-titulo { font-size: 24px; }
    #cabecera { margin-top: -96px; padding-top: 104px; }
  }
  /* En la tele: todo más grande y la flecha de «Ver todo» siempre visible */
  .tele { --margen: 48px; --ancho-cartel: 210px; }
  .tele .heroe h1 { font-size: 64px; }
  .tele .heroe-sinopsis { font-size: 20px; }
  .tele .fila-titulo { font-size: 26px; }
  .tele .ver-todo { opacity: 1; transform: none; }
  .tele .boton-blanco, .tele .boton-gris { font-size: 22px; padding: 14px 34px; }
  .tele .boton-blanco:focus, .tele .boton-gris:focus { outline: 3px solid #fff; outline-offset: 3px; }
  .tele #nav a { font-size: 19px; }
  .tele #nav a:focus { color: #fff; outline: none; text-decoration: underline; text-underline-offset: 6px; }
</style>
