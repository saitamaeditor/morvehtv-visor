<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MorvehTV</title>
<meta name="theme-color" content="#0f1115">
<!-- Para añadirla a la pantalla de inicio del móvil como si fuera una app -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icono-192.png">
<!-- Las carátulas vienen de aquí: se abre la conexión ya, mientras carga la app -->
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="dns-prefetch" href="https://static.tvmaze.com">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MorvehTV">
<script src="polyfills.js"></script>
<style>
  :root {
    --fondo: #0f1115; --panel: #171a21; --panel2: #1f232c; --borde: #2a2f3a;
    --texto: #e7e9ee; --suave: #9aa1ad; --acento: #4f8cff; --peligro: #ff6b6b;
  }
  * { box-sizing: border-box; }
  /* Sin el recuadro naranja/amarillo que Android (Chrome y la app) pinta al tocar o enfocar algo:
     el foco se marca solo con los estilos propios de más abajo */
  html { -webkit-tap-highlight-color: transparent; }
  :focus { outline: none; }
  video:focus { outline: none !important; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
  button, input, select { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--borde); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .logo small { color: var(--suave); font-weight: 400; }
  .logo .tv { background: linear-gradient(135deg, #4f8cff, #8e4ec6 50%, #d6409f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* Ruta de navegación: una fila de pastillas que se desliza de lado si no cabe */
  #migas { display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; flex: 1 1 100%; min-width: 0; order: 3;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 3px 2px; scroll-behavior: smooth;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
  #migas::-webkit-scrollbar { display: none; }
  #migas a, #migas .actual { flex: none; display: inline-flex; align-items: center; gap: 6px; max-width: 26ch; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--texto); text-decoration: none; padding: 5px 12px; border-radius: 999px; font-size: 13.5px; line-height: 1.3;
    background: var(--panel2); border: 1px solid var(--borde); cursor: pointer; transition: border-color .15s, background .15s; }
  #migas a:hover { border-color: var(--acento); }
  #migas .actual { background: var(--acento); border-color: var(--acento); color: #fff; font-weight: 700; }
  #migas a.casa { padding: 5px 10px; }
  #migas .sep { flex: none; color: var(--suave); font-size: 16px; line-height: 1; }
  select { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 10px; }
  .boton { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 10px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--texto); display: inline-flex; gap: 6px; align-items: center; }
  .boton:hover { border-color: var(--acento); }
  .boton.activo { background: var(--acento); border-color: var(--acento); color: #fff; }
  main { padding: 16px; --margen-main: 16px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .item { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .item:hover { border-color: var(--acento); }
  .item { position: relative; }
  .item .nuevo { position: absolute; top: 6px; left: 6px; z-index: 1; background: var(--acento); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .lista .item .nuevo { top: 2px; left: 2px; font-size: 9px; padding: 1px 4px; }
  #directo { font-size: 12px; color: var(--suave); display: inline-flex; gap: 5px; align-items: center; }
  #directo::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--suave); }
  #directo.vivo::before { background: #30a46c; box-shadow: 0 0 6px #30a46c; }
  .item .mini { aspect-ratio: 4/3; display: grid; place-items: center; background: var(--panel2); font-size: 40px; overflow: hidden; }
  .item .mini img { width: 100%; height: 100%; object-fit: cover; }
  .item .nombre { padding: 8px; word-break: break-word; font-size: 13px; }
  .item .meta { padding: 0 8px 8px; color: var(--suave); font-size: 12px; }
  /* Sinopsis corta en las tarjetas (temporadas, episodios y películas) */
  .item .resumen { margin: -2px 8px 10px; color: #b3b9c4; font-size: 12px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .nombre { font-weight: 600; }
  .tele .item .resumen { font-size: 13px; }
  #cabecera .ficha h3 { color: #fff; }
  .lista .item { flex-direction: row; align-items: center; }
  .lista { display: flex; flex-direction: column; gap: 4px; }
  .lista .item .mini { width: 44px; aspect-ratio: 1; font-size: 22px; flex: none; }
  .lista .item .nombre { flex: 1; }
  .lista .item .meta { padding: 0 12px; white-space: nowrap; }
  .vacio { color: var(--suave); padding: 40px; text-align: center; }
  .error { color: var(--peligro); }
  #mas { margin: 16px auto; display: block; }
  /* Vista previa */
  #visor { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.92); z-index: 10; display: none; flex-direction: column; }
  #visor.abierto { display: flex; }
  #visor .barra { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--borde); flex-wrap: wrap; }
  #visor .titulo { flex: 1; min-width: 150px; word-break: break-all; }
  #visor .contenido { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 16px; overflow: auto; padding: 16px; position: relative; }
  #visor .contenido > video, #visor .contenido > img { max-width: 100%; max-height: calc(100vh - 110px); }
  #visor .contenido > video { max-height: 68vh; }
  #visor iframe { width: 100%; height: calc(100vh - 110px); border: 0; background: #fff; }
  /* (el iframe de los anuncios de Google lo pone y lo mide su SDK: sin el fondo blanco de arriba) */
  #visor .anuncio-previo .ima iframe { width: 100%; height: 100%; background: transparent; }
  /* Banner de la red de anuncios en la pantalla previa: a su tamaño, centrado (más grande en la tele) */
  #visor .anuncio-previo iframe.marco-previo { width: var(--ancho, 300px); height: var(--alto, 250px); max-width: 100%; background: transparent; align-self: center; border-radius: 6px; }
  #visor .anuncio-previo .hueco-banner { position: relative; width: var(--ancho, 300px); height: var(--alto, 250px); max-width: 100%; align-self: center; display: grid; place-items: center; }
  #visor .anuncio-previo .hueco-banner iframe.marco-previo { position: absolute; inset: 0; border: 0; }
  #visor .anuncio-previo .hueco-banner .fondo-banner { width: 100%; height: 100%; box-sizing: border-box; margin: 0; padding: 16px; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 6px; }
  #visor .anuncio-previo .hueco-banner .fondo-banner .texto { flex: none; padding: 0; align-items: center; }
  .tele #visor .anuncio-previo .hueco-banner { zoom: 1.6; }
  .tele #visor .anuncio-previo .hueco-banner iframe.marco-previo { zoom: 1; }
  .anuncio-previo .escena.con-banner { align-items: center; gap: 16px; padding: 8px 0; }
  .tele #visor .anuncio-previo iframe.marco-previo { zoom: 1.6; }
  /* Reproductor de otro sitio (enlace .url / .strm) y su aviso de fallo */
  #visor iframe.incrustado { background: #000; flex: 1; min-height: 0; }
  .fallo-enlace { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .fallo-enlace p { margin: 0 0 4px; font-size: 1.1em; }
  .fallo-enlace .boton { padding: 10px 22px; border-radius: 8px; background: var(--panel); color: #fff; border: 1px solid #fff3; cursor: pointer; font: inherit; }
  .fallo-enlace .boton:focus, .fallo-enlace .boton:hover { background: #fff; color: #000; }
  #visor pre { white-space: pre-wrap; word-break: break-word; background: var(--panel); padding: 16px; border-radius: 8px; max-width: 1000px; width: 100%; margin: 0; align-self: start; }
  #visor audio { width: min(600px, 100%); }
  .flecha { position: absolute; top: 50%; transform: translateY(-50%); font-size: 28px; background: rgba(0,0,0,.5); border: 0; color: #fff; width: 44px; height: 64px; cursor: pointer; border-radius: 8px; }
  .flecha:hover { background: rgba(224,69,155,.6); }
  #ant { left: 8px; } #sig { right: 8px; }
  .categorias { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .lista .categorias { margin-bottom: 8px; }
  .cat { --c: var(--acento); border-radius: 14px; padding: 18px; cursor: pointer; border: 1px solid var(--borde);
    background: linear-gradient(135deg, color-mix(in srgb, var(--c) 35%, var(--panel)), var(--panel) 70%); transition: transform .12s, border-color .12s; }
  .cat:hover { transform: translateY(-2px); border-color: var(--c); }
  .cat .icono { font-size: 34px; }
  .cat .nombre { font-size: 17px; font-weight: 700; margin-top: 8px; }
  .cat .meta { color: var(--suave); font-size: 12px; margin-top: 4px; }
  /* Con imagen: el fondo de un título de la categoría, teñido con su color para leer bien */
  .cat { position: relative; overflow: hidden; isolation: isolate; min-height: 150px; }
  .cat::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; opacity: 0;
    background: var(--img) center / cover no-repeat; transition: opacity .6s ease, transform 6s ease; }
  .cat::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; opacity: 0; transition: opacity .6s ease;
    background: linear-gradient(100deg, rgba(10,12,16,.9) 15%, rgba(10,12,16,.5) 55%, rgba(10,12,16,.1)),
      linear-gradient(to top, var(--c), transparent 65%); }
  .cat.con-imagen::before, .cat.con-imagen::after { opacity: 1; }
  .cat.con-imagen { background: linear-gradient(135deg, var(--c), var(--panel) 75%); border-color: rgba(255,255,255,.08); }
  .cat.con-imagen::before { mix-blend-mode: normal; }
  .cat.con-imagen:hover::before, .cat.con-imagen:focus::before { transform: scale(1.08); }
  .cat.con-imagen .nombre { font-size: 20px; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .cat.con-imagen .meta { color: #d5d9e2; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  .cat.con-imagen .icono { filter: drop-shadow(0 2px 8px rgba(0,0,0,.7)); }
  /* Franja del color de la categoría a la izquierda */
  .cat.con-imagen { box-shadow: inset 4px 0 0 var(--c); }
  .cat.vacia { opacity: .4; cursor: default; }
  .cat.vacia.con-imagen { opacity: .55; filter: grayscale(.6); }
  .cat.vacia:hover { transform: none; border-color: var(--borde); }
  .seccion { grid-column: 1 / -1; font-size: 15px; color: var(--suave); margin: 16px 0 0; font-weight: 600; }
  .repro { position: relative; display: flex; flex-direction: column; width: 100%; max-width: 1400px; background: #000; }
  .repro video { width: 100%; max-height: 62vh; cursor: pointer; }
  .repro:fullscreen video { max-height: calc(100vh - 56px); flex: 1; }
  .controles { display: flex; gap: 8px; align-items: center; padding: 8px; background: var(--panel); flex-wrap: wrap; }
  .controles input[type=range] { flex: 1; min-width: 140px; accent-color: var(--acento); }
  .controles .tiempo { color: var(--suave); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .controles select { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 6px; }
  /* Idioma del audio: botón y su lista (encima de los controles; se maneja con el mando) */
  .controles .boton.audio { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-audio { position: absolute; left: 10px; bottom: 64px; z-index: 6; min-width: 220px; max-width: calc(100% - 20px); max-height: 60%; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 12px; background: rgba(16,17,24,.97); border: 1px solid var(--borde); box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .menu-audio h4 { margin: 4px 10px 6px; font-size: 13px; font-weight: 600; color: var(--suave); }
  .menu-audio button { text-align: left; padding: 10px 14px; border: 0; border-radius: 8px; background: none; color: var(--texto); font: inherit; font-size: 15px; cursor: pointer; }
  .menu-audio button::before { content: ''; display: inline-block; width: 1.4em; }
  .menu-audio button.activo::before { content: '✓'; }
  .menu-audio button:hover, .menu-audio button:focus { background: var(--acento); color: #fff; outline: none; }
  #visor.cine .menu-audio { bottom: 90px; z-index: 30; }
  .tele .menu-audio { min-width: 30vw; } .tele .menu-audio h4 { font-size: 2.2vh; } .tele .menu-audio button { font-size: 2.8vh; padding: 1.3vh 1.6vw; }
  /* ---------- Modo cine: el vídeo ocupa toda la pantalla ---------- */
  #salircine { display: none; }
  #visor.cine { background: #000; }
  #visor.cine .barra { position: fixed; top: 0; left: 0; right: 0; z-index: 3; background: linear-gradient(rgba(0,0,0,.8), transparent);
    border: 0; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left)); transition: opacity .3s; }
  #visor.cine .barra > * { display: none; }
  #visor.cine .barra #salircine, #visor.cine .barra #vtitulo { display: inline-flex; }
  #visor.cine .barra #vfav:not([hidden]) { display: inline-flex; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); }
  #visor.cine #salircine { order: -1; }
  #visor.cine #vtitulo { flex: 1; text-shadow: 0 1px 4px #000; word-break: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #visor.cine .flecha, #visor.cine .ficha { display: none !important; }
  #visor.cine .contenido { padding: 0; overflow: hidden; justify-content: center; }
  #visor.cine .repro { position: fixed; top: 0; left: 0; right: 0; bottom: 0; max-width: none; z-index: 1; }
  #visor.cine .repro video, #visor.cine .contenido > video {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; max-height: none; object-fit: contain; background: #000; }
  #visor.cine .controles {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; border: 0; transition: opacity .3s;
    background: linear-gradient(transparent, rgba(0,0,0,.88));
    padding: 36px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #visor.cine .controles .boton, #visor.cine .controles select { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); }
  #visor.cine .controles .tiempo { color: #e7e9ee; }
  #visor.cine .cargando { position: fixed; top: calc(50% + 78px); left: 50%; transform: translate(-50%, -50%); font-size: 18px; padding: 10px 16px; z-index: 2; }
  /* Viendo el vídeo, a los 3 s se esconden solos los botones, la barra de progreso y la barra
     de arriba; vuelven al tocar la pantalla, mover el ratón o pulsar el mando */
  #visor.cine.reposo .controles, #visor.cine.reposo .barra { opacity: 0; }
  #visor.cine.reposo .controles *, #visor.cine.reposo .barra * { pointer-events: none; }
  #visor.cine.reposo video { cursor: none; }
  /* Botones agrupados a la izquierda; la barra de progreso ocupa el resto */
  .controles { justify-content: flex-start; }
  .tele #visor.cine .controles .boton { font-size: 24px; }
  /* ▶ grande en el centro mientras el vídeo está en pausa */
  .gran-play {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 2;
    width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); cursor: pointer;
    background: rgba(10,12,16,.55); color: #fff; font-size: 34px; line-height: 1; padding-left: 6px;
    box-shadow: 0 6px 30px rgba(0,0,0,.6); transition: transform .15s, background .15s;
  }
  .gran-play:hover, .gran-play:focus { background: rgba(224,69,155,.75); transform: translate(-50%, -50%) scale(1.06); outline: none; }
  #visor.cine .gran-play { position: fixed; top: 50%; }
  .tele .gran-play { width: 110px; height: 110px; font-size: 44px; }
  .cargando { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.7); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
  /* Metadatos */
  .item .mini.cartel { aspect-ratio: 2/3; }
  .item .mini.ancha { aspect-ratio: 16/9; }
  .lista .item .mini.cartel, .lista .item .mini.ancha { aspect-ratio: 1; }
  #cabecera { border-radius: 14px; margin-bottom: 16px; background-size: cover; background-position: center; border: 1px solid var(--borde); }
  .ficha { display: flex; gap: 20px; width: 100%; max-width: 1400px; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; text-align: left; }
  #cabecera .ficha { background: transparent; border: 0; }
  .ficha img.cartel { width: 170px; height: auto; max-height: none; border-radius: 8px; align-self: flex-start; flex: none; }
  .ficha .cuerpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .ficha h2 { margin: 0; font-size: 22px; }
  .ficha h3 { margin: 6px 0 0; font-size: 16px; }
  .ficha p { margin: 0; line-height: 1.55; max-width: 80ch; }
  .suave { color: var(--suave); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { background: var(--panel2); border: 1px solid var(--borde); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .linea { font-size: 13px; }
  .tecnico { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--suave); border-top: 1px solid var(--borde); padding-top: 8px; word-break: break-all; }
  .corrector input { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 10px; flex: 1; min-width: 140px; }
  .corrector summary { cursor: pointer; color: var(--suave); font-size: 13px; }
  .corrector .chips { margin-top: 8px; }
  .resultados { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; margin-top: 8px; }
  .resultado { display: flex; gap: 8px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 6px; cursor: pointer; }
  .resultado:hover { border-color: var(--acento); }
  .resultado img { width: 40px; border-radius: 4px; }
  /* ---------- Mando de la tele ---------- */
  .item:focus, .cat:focus, .boton:focus, #migas a:focus, select:focus, input:focus, summary:focus, .flecha:focus {
    outline: 3px solid var(--acento); outline-offset: 2px;
  }
  html:not(.usa-mando):not(.tele) .item:focus:not(:focus-visible), html:not(.usa-mando):not(.tele) .cat:focus:not(:focus-visible),
  html:not(.usa-mando):not(.tele) .boton:focus:not(:focus-visible) { outline: none; }
  .tele body, .usa-mando body { scroll-behavior: smooth; }
  .tele .item:focus, .tele .cat:focus { transform: scale(1.06); box-shadow: 0 10px 30px rgba(224,69,155,.45); z-index: 2; }
  .item, .cat { transition: transform .12s, box-shadow .12s, border-color .12s; }
  /* En la tele todo más grande: se ve desde el sofá */
  .tele body { font-size: 20px; }
  /* Márgenes en % para que nada quede cortado por el borde de la tele (overscan) */
  .tele header { padding: 10px 4vw; }
  .tele main { padding: 2.5vh 4vw; --margen-main: 4vw; }
  /* Las teles muestran la web a poca resolución (unos 960×540): las carátulas se miden por el
     alto de la pantalla para que quepa una fila entera con su texto, unas 6 por fila */
  .tele .rejilla { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-template-columns: repeat(auto-fill, minmax(21vh, 1fr)); gap: 3vh 1.8vw; }
  .tele .item .nombre { padding: 6px 8px 2px; }
  .tele .item .resumen { -webkit-line-clamp: 2; }
  .tele .ficha img.cartel { width: 26vh; }
  /* Cabecera de serie o temporada en la tele: compacta (unos 40 % de la pantalla) para que debajo
     se vean ya las temporadas y los episodios */
  .tele #cabecera { margin-bottom: 2.5vh; }
  .tele #cabecera .ficha { padding: 2vh 2vw; gap: 2vw; font-size: 14px; }
  .tele #cabecera .ficha img.cartel { width: 15vh; }
  .tele #cabecera .ficha .cuerpo { gap: 5px; }
  .tele #cabecera .ficha h2 { font-size: 24px; }
  .tele #cabecera .ficha h3 { font-size: 16px; margin: 2px 0 0; }

  .guia-cuerpo b { color: var(--texto); } .guia-cuerpo a { color: var(--acento); }
  .tele .pago-importe b { font-size: 40px; } .tele .pago-qr { width: 220px; height: 220px; } .tele .guia-cuerpo { font-size: 18px; }
  @media (max-width: 420px) { .pago-importe b { font-size: 26px; } .pago-qr { width: 130px; height: 130px; } }
  .tele .acepto-premium { font-size: 18px; } .tele .acepto-premium input { width: 28px; height: 28px; }
  .cuenta-bloque.plan-premium h3::after { content: ' ⭐ VIP'; color: #ffb224; }
  .cuenta-bloque.plan-basico .boton-acento { background: linear-gradient(90deg, #4f8cff, #7b5cff); border-color: transparent; }
  /* Botón para salir (solo en la app de Android) */
  #salir-app { flex: none; margin-left: auto; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; }
  /* Seguir viendo: barra de lo visto en la tarjeta y botón para empezar de cero */
  .item .mini { position: relative; }
  .item .visto { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.25); }
  .item .visto span { display: block; height: 100%; background: #e5484d; }
  .repro .de-cero { position: absolute; left: 50%; top: calc(50% + 70px); transform: translateX(-50%); z-index: 3;
    background: rgba(0,0,0,.65); border-color: rgba(255,255,255,.3); white-space: nowrap; }
  #visor.cine .repro .de-cero { position: fixed; }
  .tele .repro .de-cero { top: calc(50% + 90px); font-size: 20px; }
  #salir-app:hover, #salir-app:focus { background: rgba(229,72,77,.85); border-color: #e5484d; color: #fff; outline: none; }
  /* ================= Mi cuenta ================= */
  #mi-cuenta { flex: none; margin-left: auto; padding: 3px 12px 3px 3px; border-radius: 999px; background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.1); }
  #mi-cuenta:hover, #mi-cuenta:focus { border-color: var(--acento); outline: none; }
  #mi-cuenta + #salir-app { margin-left: 0; }
  @media (max-width: 600px) {
    /* Logo, pestañas y cuenta en la misma fila (si no caben, las pestañas se deslizan); la ruta
       de carpetas, si la hay, va en la de abajo */
    header .logo { flex: 1 1 0; min-width: 0; } }
  .inicial { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
    background: linear-gradient(135deg, #e0459b, #8e4ec6); color: #fff; font-weight: 800; font-size: 15px; }
  .inicial.grande { width: 64px; height: 64px; font-size: 30px; }
  #cuenta { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40; overflow-y: auto; padding: 5vh 16px;
    background: rgba(5,6,8,.78); display: flex; justify-content: center; align-items: flex-start; }
  #cuenta[hidden] { display: none; }
  .con-cuenta body { overflow: hidden; }
  .cuenta-caja { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; padding: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
  .cuenta-cab { display: flex; align-items: center; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--borde); }
  .cuenta-cab > div:nth-child(2) { flex: 1; min-width: 0; }
  .cuenta-cab h2 { margin: 0; font-size: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cuenta-cerrar { align-self: flex-start; border-radius: 50%; width: 38px; height: 38px; justify-content: center; padding: 0; }
  .cuenta-bloque { padding: 18px 0; border-bottom: 1px solid var(--borde); display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .cuenta-bloque:last-child { border-bottom: 0; padding-bottom: 4px; }
  .cuenta-bloque h3 { margin: 0; font-size: 16px; }
  .cuenta-texto { margin: 0; color: var(--suave); font-size: 13.5px; line-height: 1.45; }
  .cuenta-bloque label { width: 100%; display: flex; flex-direction: column; gap: 6px; color: var(--suave); font-size: 13.5px; }
  .cuenta-bloque input { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); font: inherit; font-size: 15px; }
  .cuenta-bloque input:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px rgba(224,69,155,.25); }
  .cuenta-bloque .boton:focus, .cuenta-cerrar:focus { outline: none; box-shadow: 0 0 0 3px var(--acento); }
  .cuenta-botones { display: flex; flex-wrap: wrap; gap: 10px; }
  .boton-acento { background: var(--acento); border-color: var(--acento); color: #fff; font-weight: 700; }
  .boton-peligro { color: #ff6b6b; border-color: rgba(255,107,107,.5); background: transparent; }
  .boton-peligro:hover, .boton-peligro:focus { background: #e5484d; border-color: #e5484d; color: #fff; }
  .cuenta-bloque.peligro h3 { color: #ff6b6b; }
  .cuenta-msg { margin: 0; min-height: 0; font-size: 13.5px; }
  .cuenta-msg.bien { color: #3dd68c; }
  .cuenta-msg.mal { color: #ff6b6b; }
  .tele .cuenta-caja { max-width: 760px; font-size: 20px; }
  .tele .cuenta-bloque input, .tele .cuenta-bloque .boton { font-size: 20px; }
  .tele #mi-cuenta .inicial { width: 5.5vh; height: 5.5vh; font-size: 2.8vh; }
  @media (max-width: 600px) {
    #mi-cuenta { padding: 3px; }
    #mi-cuenta .txt { display: none; }
    #cuenta { padding: 0; }
    .cuenta-caja { border-radius: 0; min-height: 100%; border: 0; }
  }
  /* Mi lista */
  /* Pestañas «Seguir viendo» y «Favoritos» junto al logo */
  #pestanas { display: flex; gap: 6px; }
  #pestanas[hidden], #directo[hidden] { display: none; }
  .pestana { background: var(--panel2); color: var(--texto, #e6e8eb); border: 1px solid var(--borde); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .pestana:hover, .pestana:focus { border-color: var(--acento); outline: none; }
  .pestana.activa { background: var(--acento); border-color: var(--acento); color: #fff; }
  /* En pantallas medianas, el texto «Inicio» sobra: la casita basta */
  @media (max-width: 900px) { #migas .txt-casa { display: none; } }
  /* Tele: la ruta en una fila propia, legible desde el sofá pero sin ocupar media pantalla */
  .tele #migas { flex-basis: 100%; gap: 0.8vw; padding: 0.4vh 0.2vw; }
  .tele #migas a, .tele #migas .actual { font-size: 2.4vh; padding: 0.7vh 1.4vw; max-width: 30vw; }
  .tele #migas .sep { font-size: 2.6vh; }
  .tele #migas a:focus { outline: 3px solid #fff; outline-offset: 2px; }
  /* Estrella de favoritos en la esquina de cada tarjeta */
  .item .estrella { position: absolute; top: 6px; right: 6px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; opacity: 0; transition: opacity .15s, transform .15s; }
  .item:hover .estrella, .item:focus .estrella, .item .estrella.activo { opacity: 1; }
  .item .estrella:hover { transform: scale(1.12); }
  .item .estrella.activo { color: #ffd60a; }
  @media (pointer: coarse) { .item .estrella { opacity: 1; } }
  .lista .item .estrella { top: 50%; transform: translateY(-50%); }
  #vfav { font-size: 18px; }
  #vfav.activo { color: #ffd60a; border-color: #ffd60a; }
  .favorito.activo { background: rgba(48,164,108,.2); border-color: #30a46c; color: #8ff0b8; }

  /* ---------- Tarjetas de categoría: el mismo aspecto en móvil, tablet, ordenador y tele ----------
     Todas con la misma proporción y el texto abajo; columnas según el ancho (6 categorías = 2
     filas de 3 en pantallas grandes, 3 de 2 en el móvil) y letra que crece con la pantalla */
  .categorias { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.4vw, 22px); }
  .cat { display: flex; flex-direction: column; justify-content: flex-end; aspect-ratio: 16 / 9; min-height: 0; padding: clamp(12px, 1.5vw, 24px); }
  /* (sin esto, la regla de los iconos del reproductor encogía el emoji y tapaba el nombre) */
  .cat .icono { width: auto; height: auto; line-height: 1; font-size: clamp(24px, 2.4vw, 40px); }
  .cat .nombre, .cat.con-imagen .nombre { font-size: clamp(15px, 1.6vw, 26px); line-height: 1.15; margin-top: .35em; }
  .cat .meta { font-size: clamp(11px, .9vw, 14px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 1100px) { .categorias { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .categorias { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cat .icono { font-size: clamp(24px, 4.4vw, 34px); }
    .cat .nombre, .cat.con-imagen .nombre { font-size: clamp(15px, 3vw, 22px); }
    .cat .meta { font-size: clamp(11px, 1.8vw, 13px); }
  }
  /* Móvil en vertical: un poco más altas, para que quepan el icono, el nombre y los datos */
  @media (max-width: 600px) { .cat { aspect-ratio: 4 / 3; } }
  /* Móvil en horizontal: pantalla ancha y baja, 3 por fila */
  @media (max-height: 500px) and (orientation: landscape) {
    .categorias { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cat { aspect-ratio: 16 / 9; padding: 10px 12px; }
    .cat .icono { font-size: 22px; }
    .cat .nombre, .cat.con-imagen .nombre { font-size: 15px; }
  }
  /* Tele: medidas por el alto de la pantalla (las teles muestran la web a unos 960×540) */
  .tele .categorias { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.6vh 1.6vw; }
  .tele .cat { aspect-ratio: 16 / 9; padding: 2.6vh 1.4vw; }
  .tele .cat .icono { font-size: 5.2vh; }
  .tele .cat .nombre, .tele .cat.con-imagen .nombre { font-size: 3.6vh; }
  .tele .cat .meta { font-size: 2.2vh; }
  @supports not (aspect-ratio: 1) {
    .cat { min-height: 130px; }
    .tele .cat { min-height: 24vh; }
  }

  /* Portada de cada categoría: su color, el fondo de uno de tus títulos (apagado) y, a la
     derecha, un abanico con hasta 3 carteles; el icono, el nombre y los datos abajo a la izquierda */
  .cat .texto { position: relative; z-index: 2; max-width: 50%; }
  .cat .abanico { position: absolute; z-index: 1; top: 15%; bottom: 15%; right: 5%; width: 38%; pointer-events: none; }
  .cat .cartel-cat { position: absolute; top: 0; height: 100%; width: auto; border-radius: 7px;
    box-shadow: 0 10px 26px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.14); transition: transform .35s ease; }
  .cat .cartel-cat.c1 { right: 20%; z-index: 3; }
  .cat .cartel-cat.c2 { right: 0; z-index: 2; transform: rotate(9deg) scale(.86); transform-origin: 30% 100%; }
  .cat .cartel-cat.c3 { right: 40%; z-index: 1; transform: rotate(-9deg) scale(.86); transform-origin: 70% 100%; }
  .cat:hover .cartel-cat.c1, .cat:focus .cartel-cat.c1 { transform: translateY(-5%) scale(1.04); }
  .cat:hover .cartel-cat.c2, .cat:focus .cartel-cat.c2 { transform: rotate(14deg) scale(.88) translateX(6%); }
  .cat:hover .cartel-cat.c3, .cat:focus .cartel-cat.c3 { transform: rotate(-14deg) scale(.88) translateX(-6%); }
  /* Con carteles, el fondo se apaga para que destaquen y el color de la categoría manda */
  .cat.con-imagen.con-carteles::before { opacity: .42; }
  /* (la primera línea, para las teles antiguas que no entienden color-mix) */
  .cat.con-carteles { background: linear-gradient(135deg, var(--c), #0d0f14 72%); }
  .cat.con-carteles { background: radial-gradient(circle at 78% 40%, color-mix(in srgb, var(--c) 55%, transparent), transparent 62%),
    linear-gradient(135deg, color-mix(in srgb, var(--c) 40%, #0d0f14), #0d0f14 72%); }
  .cat.con-carteles::after { opacity: 1; background: linear-gradient(90deg, rgba(10,12,16,.88) 20%, rgba(10,12,16,.35) 60%, rgba(10,12,16,.05)); }
  .cat.con-carteles::after { background: linear-gradient(90deg, rgba(10,12,16,.88) 20%, rgba(10,12,16,.35) 60%, rgba(10,12,16,.05)),
    linear-gradient(to top, color-mix(in srgb, var(--c) 70%, transparent), transparent 55%); }
  .cat { box-shadow: inset 0 -3px 0 var(--c); }
  .cat.sin-nada { opacity: .7; }
  /* Móvil en vertical: los carteles arriba y el texto abajo, a todo lo ancho */
  @media (max-width: 600px) {
    .cat .texto { max-width: 100%; }
    .cat .abanico { top: 7%; bottom: 47%; right: 8%; width: 62%; }
    .cat .icono { display: none; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .cat .abanico { top: 12%; bottom: 12%; width: 38%; }
    .cat .texto { max-width: 48%; }
    .cat .cartel-cat.c3 { display: none; } /* tarjetas bajas: con dos basta y no rozan el texto */
  }
  .tele .cat .texto { max-width: 46%; }

  /* ---------- Dentro de las categorías: carátulas, episodios y ficha en cada pantalla ----------
     Las columnas y la letra crecen con la pantalla: en un ordenador grande ya no salen 8
     columnas diminutas, y los episodios (imagen apaisada) van en tarjetas más anchas */
  .rejilla { grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 12.5vw, 220px), 1fr)); gap: clamp(10px, 1.3vw, 20px); }
  .rejilla.con-episodios { grid-template-columns: repeat(auto-fill, minmax(clamp(220px, 19vw, 340px), 1fr)); }
  .item .nombre { font-size: clamp(13px, 1.05vw, 17px); line-height: 1.3; }
  .item .meta { font-size: clamp(11.5px, .88vw, 14px); }
  .item .resumen { font-size: clamp(12px, .9vw, 14px); }
  .ver-mas { display: none; }
  /* Tablet: se mira más de cerca que un ordenador, la letra no baja del tamaño cómodo */
  @media (min-width: 601px) and (max-width: 1100px) {
    .item .nombre { font-size: 14.5px; }
    .item .meta { font-size: 12.5px; }
    .item .resumen { font-size: 13px; }
  }
  @media (max-width: 600px) {
    .rejilla { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    /* Episodios: uno por fila, la imagen a la izquierda y el texto a la derecha */
    .rejilla.con-episodios { grid-template-columns: minmax(0, 1fr); }
    .rejilla .item.episodio { display: grid; grid-template-columns: 44% minmax(0, 1fr); grid-auto-rows: min-content; align-content: start; }
    .rejilla .item.episodio .mini { grid-row: 1 / span 3; grid-column: 1; align-self: stretch; aspect-ratio: auto; min-height: 96px; }
    .rejilla .item.episodio .nombre, .rejilla .item.episodio .meta, .rejilla .item.episodio .resumen { grid-column: 2; }
    .rejilla .item.episodio .resumen { margin: 0 8px 8px; -webkit-line-clamp: 3; }
    .rejilla .item.episodio .estrella { right: auto; left: 6px; }
    .item .nombre { font-size: 14px; }
    .item .meta { font-size: 12px; }
    .item .resumen { font-size: 12.5px; }
    /* Ficha: cartel pequeño junto al título y debajo, a lo ancho, el resto; sinopsis de 4
       líneas y reparto escondido hasta pulsar «Ver más» */
    .ficha { display: grid; grid-template-columns: 96px minmax(0, 1fr); column-gap: 12px; row-gap: 8px; align-items: start; padding: 12px; }
    .ficha img.cartel { width: 96px; grid-row: 1 / span 3; }
    .ficha .cuerpo { display: contents; }
    .ficha .cuerpo > * { grid-column: 1 / -1; }
    .ficha .cuerpo > h2, .ficha .cuerpo > h2 + .suave, .ficha .cuerpo > .datos { grid-column: 2; }
    .ficha h2 { font-size: 19px; line-height: 1.2; }
    .ficha .chips.datos .chip { font-size: 11.5px; }
    .ficha:not(.entera) .cuerpo > p { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .ficha:not(.entera) .linea, .ficha:not(.entera) .cuerpo > p.suave { display: none; }
    .ver-mas { display: inline-flex; justify-self: start; padding: 4px 12px; font-size: 13px; min-height: 0; }
    /* Arriba: logo y pestañas en una sola fila */
    .logo { gap: 6px; }
    #pestanas { gap: 4px; }
    .pestana { padding: 5px 8px; font-size: 11.5px; }
  }
  /* Móvil muy estrecho (320-380 px): solo la nube del logo, para que todo quepa en una fila */
  @media (max-width: 380px) { .logo > span:not(#directo) { display: none; } }
  /* Tele: por el alto de la pantalla; episodios más anchos */
  .tele .rejilla { grid-template-columns: repeat(auto-fill, minmax(21vh, 1fr)); gap: 3vh 1.8vw; }
  .tele .rejilla.con-episodios { grid-template-columns: repeat(auto-fill, minmax(40vh, 1fr)); }
  .tele .item .nombre { font-size: 2.9vh; }
  .tele .item .meta { font-size: 2.3vh; }
  .tele .item .resumen { font-size: 2.3vh; }

  /* ================= Aspecto de servidor multimedia =================
     Fondo casi negro, un solo color de acento, carteles sin marco con el título debajo, inicio
     en filas que se deslizan y ficha con el fondo del título a lo grande */
  :root { --fondo: #101114; --panel: #1a1c21; --panel2: #24272e; --borde: #2e323a; --texto: #f1f2f4; --suave: #a3a9b4; --acento: #00a4dc; }
  body { background: var(--fondo); }
  header { background: rgba(16,17,20,.9); border-bottom: 0; box-shadow: 0 1px 0 rgba(255,255,255,.06); }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    header { background: rgba(16,17,20,.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  }
  .logo .tv { background: none; color: var(--acento); }
  /* Pestañas: texto con una raya debajo en la activa */
  .pestana { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 4px; margin: 0 6px; color: var(--suave); font-size: 14px; }
  .pestana:hover, .pestana:focus { color: #fff; border-color: transparent; border-bottom-color: rgba(255,255,255,.35); }
  .pestana.activa { background: none; color: #fff; border-bottom-color: var(--acento); }
  /* Si no caben (móvil), las pestañas se deslizan en vez de ensanchar la página */
  #pestanas { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #pestanas::-webkit-scrollbar { display: none; }
  .logo { min-width: 0; }
  .tele .pestana:focus { color: #fff; border-bottom-color: var(--acento); background: rgba(255,255,255,.08); border-radius: 6px 6px 0 0; }
  .boton { border-radius: 6px; }
  .boton.activo { background: var(--acento); border-color: var(--acento); }

  /* Inicio */
  #items.inicio { display: block; }
  .fila { margin: 0 0 clamp(18px, 2.6vw, 36px); }
  .fila-titulo { font-size: clamp(16px, 1.45vw, 22px); font-weight: 700; margin: 0 0 8px; letter-spacing: .01em; }
  .fila-titulo a { color: var(--texto); text-decoration: none; border-radius: 6px; padding: 2px 4px; margin-left: -4px; }
  .fila-titulo a:hover, .fila-titulo a:focus { color: var(--acento); }
  .carrusel { display: flex; gap: clamp(10px, 1.1vw, 18px); overflow-x: auto; overflow-y: hidden; padding: 8px 6px 14px; margin: -8px -6px 0;
    scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .carrusel::-webkit-scrollbar { display: none; }
  .carrusel > * { flex: 0 0 auto; scroll-snap-align: start; }
  /* Con el mando el desplazamiento lo lleva el foco (con un trozo de la siguiente a la vista): el
     «imán» de las tarjetas, pensado para el dedo, lo deshacía y dejaba la elegida cortada */
  .usa-mando .carrusel, .tele .carrusel { scroll-snap-type: none; }
  .carrusel .item { width: clamp(118px, 10.5vw, 185px); }
  .carrusel.anchas .item, .carrusel .item.episodio { width: clamp(220px, 19vw, 330px); }
  .carrusel .item .resumen { display: none; }
  .carrusel.medios .cat { width: clamp(250px, 24vw, 400px); aspect-ratio: 16 / 9; }
  .tele .carrusel .item { width: 15vw; }
  .tele .carrusel.anchas .item, .tele .carrusel .item.episodio { width: 26vw; }
  /* «Mis medios»: todas las carpetas a la vista en una rejilla (sin desplazarse de lado) y algo
     más pequeñas: 5 por fila en un ordenador grande, menos según el ancho, 2 en el móvil */
  .carrusel.medios { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(200px, 17vw, 330px), 1fr));
    overflow: visible; scroll-snap-type: none; padding: 0; margin: 0; }
  .carrusel.medios .cat { width: auto; }
  .carrusel-caja:has(> .medios) .flecha-fila { display: none; }
  .tele .carrusel.medios { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tele .carrusel.medios .cat { width: auto; }
  .tele .fila-titulo { font-size: 3.2vh; }

  /* Tarjetas: el cartel con esquinas redondeadas y sombra; título y datos debajo, centrados */
  .item { background: transparent; border: 0; border-radius: 0; overflow: visible; }
  .item:hover { border-color: transparent; }
  .item .mini { position: relative; border-radius: 8px; background: var(--panel2); box-shadow: 0 4px 14px rgba(0,0,0,.45); transition: box-shadow .15s, transform .15s; }
  .item .nombre { padding: 8px 2px 0; text-align: center; font-size: 13.5px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meta { padding: 3px 2px 0; text-align: center; font-size: 12px; }
  .item .resumen { margin: 6px 2px 0; }
  .item:hover .mini, .item:focus .mini { box-shadow: 0 0 0 3px var(--acento), 0 10px 24px rgba(0,0,0,.6); }
  .item:focus { outline: none !important; box-shadow: none !important; }
  .tele .item:focus { transform: none; }
  .tele .item:focus .mini { transform: scale(1.05); }
  /* Botón ▶ al pasar por encima */
  .item .mini::after { content: '▶'; position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    background: rgba(224,69,155,.92); color: #fff; font-size: 20px; line-height: 48px; text-align: center; padding-left: 3px; box-sizing: border-box;
    opacity: 0; transform: scale(.8); transition: opacity .15s, transform .15s; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .item:hover .mini.cartel::after, .item:hover .mini.ancha::after, .item:focus .mini.cartel::after, .item:focus .mini.ancha::after { opacity: 1; transform: none; }
  .item .visto { border-radius: 0 0 8px 8px; }
  .item .visto span { background: var(--acento); }
  /* Episodios (en la temporada): imagen apaisada y el texto a la izquierda */
  .item.episodio .nombre, .item.episodio .meta, .carrusel.anchas .item .nombre, .carrusel.anchas .item .meta { text-align: left; }
  .item.episodio .nombre { -webkit-line-clamp: 2; }
  /* Las tarjetas de categoría: más redondeadas y sin borde */
  .cat { border-radius: 10px; border: 0; }

  /* Ficha de la serie: el fondo a todo lo ancho, que se funde con la página */
  #cabecera { position: relative; margin: -16px -16px 22px; border: 0; border-radius: 0; background-color: var(--fondo); background-position: center top; background-size: cover;
    padding: clamp(90px, 20vw, 300px) clamp(16px, 3.5vw, 56px) 8px; }
  #cabecera.con-fondo { background-image: linear-gradient(180deg, rgba(16,17,20,.05) 0%, rgba(16,17,20,.45) 40%, rgba(16,17,20,.92) 78%, var(--fondo) 100%),
    linear-gradient(90deg, rgba(16,17,20,.75) 0%, rgba(16,17,20,0) 65%), var(--fondo-img); }
  #cabecera .ficha { padding: 0; max-width: none; gap: clamp(16px, 2.4vw, 36px); }
  #cabecera .ficha img.cartel { width: clamp(130px, 14vw, 240px); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.7); }
  #cabecera .ficha h2 { font-size: clamp(24px, 2.8vw, 44px); line-height: 1.1; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
  #cabecera .ficha p { text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  #cabecera .chip { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.12); }
  .boton.reproducir { background: var(--acento); border-color: var(--acento); color: #fff; font-weight: 700; padding: 9px 22px; border-radius: 999px; font-size: 15px; }
  .boton.reproducir:hover, .boton.reproducir:focus { background: #f06cb3; border-color: #fff; }
  #cabecera .boton:not(.reproducir) { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); border-radius: 999px; }
  .tele #cabecera { padding: 12vh 3vw 1vh; margin-bottom: 3vh; }
  .tele #cabecera .ficha img.cartel { width: 22vh; }
  .tele #cabecera .ficha h2 { font-size: 4.4vh; }
  .tele .boton.reproducir { font-size: 2.4vh; padding: 1vh 2.4vw; }

  /* ================= Portada con destacado, filas con flechas y biblioteca =================
     (ideas de los servidores multimedia y de las plataformas de streaming, con la identidad de
     MorvehTV: su azul y sus categorías) */
  :root { --fondo: #0b0c10; --panel: #15171d; --panel2: #1f222a; }
  /* Cabecera: en la portada, transparente sobre el destacado y sólida al bajar */
  .en-portada header { position: fixed; left: 0; right: 0; top: 0; background: linear-gradient(180deg, rgba(0,0,0,.78), rgba(0,0,0,0)); box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none; transition: background .25s; }
  .en-portada.bajado header { background: rgba(11,12,16,.94); box-shadow: 0 1px 0 rgba(255,255,255,.06); }
  .en-portada main { padding-top: 0; }
  /* Destacado */
  .destacado { position: relative; margin: 0 calc(-1 * var(--margen-main, 16px)) clamp(10px, 2vw, 28px); min-height: clamp(360px, 62vh, 760px);
    display: flex; align-items: flex-end; overflow: hidden; background: #000; }
  .destacado-fondos, .destacado-img { position: absolute; inset: 0; }
  .destacado-img { background-size: cover; background-position: center 20%; opacity: 0; transition: opacity 1s ease; transform: scale(1.03); }
  .destacado-img.visible { opacity: 1; animation: acercar 12s ease-out forwards; }
  @keyframes acercar { from { transform: scale(1.03); } to { transform: scale(1.09); } }
  /* Fluidez: en móviles, tablets y teles la cabecera va sin desenfoque detrás (es lo que más
     cuesta al desplazar) y el fondo destacado no hace zoom continuo; cada fila se pinta aparte */
  @media (hover: none), (pointer: coarse) {
    header, .en-portada.bajado header { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    header { background: rgba(16,17,20,.96); }
  }
  .tele header { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  .tele .destacado-img.visible { animation: none; }
  @media (prefers-reduced-motion: reduce) { .destacado-img.visible { animation: none; } }
  .carrusel { contain: layout paint; }
  .destacado::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(11,12,16,.92) 0%, rgba(11,12,16,.6) 38%, rgba(11,12,16,0) 70%),
      linear-gradient(0deg, var(--fondo) 0%, rgba(11,12,16,.55) 22%, rgba(11,12,16,0) 50%); }
  .destacado-texto { position: relative; z-index: 1; max-width: min(640px, 92vw); padding: 0 clamp(16px, 4vw, 64px) clamp(36px, 7vh, 80px); }
  .destacado-etiqueta { display: inline-block; font-size: 11.5px; font-weight: 800; letter-spacing: .14em; color: var(--acento); margin-bottom: 8px; }
  .destacado h1 { margin: 0 0 10px; font-size: clamp(28px, 4.4vw, 64px); line-height: 1.02; font-weight: 800; text-shadow: 0 3px 18px rgba(0,0,0,.7); }
  .destacado-datos { color: #d6dae2; font-size: clamp(13px, 1.05vw, 16px); font-weight: 600; margin-bottom: 10px; }
  .destacado-sinopsis { margin: 0 0 18px; color: #d0d4dc; font-size: clamp(13.5px, 1.1vw, 17px); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
  .destacado-botones { display: flex; gap: 10px; flex-wrap: wrap; }
  .destacado .boton { font-size: clamp(14px, 1.1vw, 17px); padding: 10px 24px; border-radius: 6px; font-weight: 700; }
  .destacado .boton.reproducir { background: #fff; border-color: #fff; color: #0b0c10; }
  .destacado .boton.reproducir:hover, .destacado .boton.reproducir:focus { background: rgba(255,255,255,.82); }
  .destacado .boton.info { background: rgba(110,118,130,.55); border-color: transparent; color: #fff; }
  .destacado .boton.info:hover, .destacado .boton.info:focus { background: rgba(110,118,130,.38); }
  .destacado .boton:focus { outline: 3px solid var(--acento); outline-offset: 2px; }
  .destacado-puntos { position: absolute; z-index: 1; right: clamp(16px, 4vw, 64px); bottom: clamp(40px, 7vh, 84px); display: flex; gap: 8px; }
  .destacado-puntos .punto { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,.35); cursor: pointer; }
  .destacado-puntos .punto.activo { background: #fff; width: 26px; border-radius: 6px; }
  /* Filas: título con «Ver todo ›» y flechas a los lados */
  .fila-titulo a { display: inline-flex; align-items: baseline; gap: 10px; }
  .ver-todo { font-size: .7em; font-weight: 700; color: var(--acento); opacity: 0; transform: translateX(-6px); transition: opacity .2s, transform .2s; }
  .fila-titulo a:hover .ver-todo, .fila-titulo a:focus .ver-todo, .fila:hover .ver-todo { opacity: 1; transform: none; }
  .carrusel-caja { position: relative; }
  .flecha-fila { position: absolute; top: 0; bottom: 14px; z-index: 3; width: clamp(34px, 3.2vw, 56px); border: 0; padding: 0; cursor: pointer;
    background: rgba(11,12,16,.55); color: #fff; font-size: clamp(30px, 3vw, 48px); line-height: 1; opacity: 0; transition: opacity .2s, background .2s; }
  .flecha-fila.izq { left: calc(-1 * var(--margen-main, 16px)); border-radius: 0 6px 6px 0; }
  .flecha-fila.der { right: calc(-1 * var(--margen-main, 16px)); border-radius: 6px 0 0 6px; }
  .fila:hover .flecha-fila { opacity: 1; }
  .flecha-fila:hover { background: rgba(11,12,16,.8); }
  .flecha-fila.oculta { display: none; }
  @media (pointer: coarse) { .flecha-fila { display: none; } }
  .tele .flecha-fila { display: none; }
  /* Pósters que crecen al pasar el ratón (en las filas) */
  @media (hover: hover) and (pointer: fine) {
    .carrusel .item { transition: transform .22s ease; transform-origin: center 40%; }
    .carrusel .item:hover { transform: scale(1.07); z-index: 2; }
  }
  /* Cabecera de la biblioteca (al entrar en una categoría) */
  .biblioteca { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 6px 0 12px; margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,.08); }
  .biblioteca h1 { margin: 0; font-size: clamp(24px, 2.6vw, 40px); font-weight: 800; }
  .biblioteca-icono { width: clamp(42px, 3.4vw, 56px); height: clamp(42px, 3.4vw, 56px); display: grid; place-items: center; border-radius: 12px;
    font-size: clamp(22px, 1.9vw, 30px); background: color-mix(in srgb, var(--c) 30%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent); }
  @supports not (background: color-mix(in srgb, red 50%, blue)) { .biblioteca-icono { background: var(--panel2); } }
  .biblioteca-cuenta { color: var(--suave); font-size: 14px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.06); }
  .tele .biblioteca h1 { font-size: 4.6vh; } .tele .biblioteca-cuenta { font-size: 2.2vh; }
  /* Episodios en lista (también en ordenador y tablet): imagen a la izquierda, texto a la derecha */
  @media (min-width: 601px) {
    .rejilla.con-episodios { grid-template-columns: minmax(0, 1fr); gap: clamp(10px, 1.2vw, 18px); }
    .rejilla .item.episodio { display: grid; grid-template-columns: clamp(180px, 26%, 380px) minmax(0, 1fr); grid-auto-rows: min-content; column-gap: 16px;
      align-content: start; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.03); }
    .rejilla .item.episodio:hover, .rejilla .item.episodio:focus { background: rgba(255,255,255,.07); }
    .rejilla .item.episodio .mini { grid-row: 1 / span 3; grid-column: 1; align-self: start; }
    .rejilla .item.episodio .nombre, .rejilla .item.episodio .meta, .rejilla .item.episodio .resumen { grid-column: 2; text-align: left; }
    .rejilla .item.episodio .nombre { padding-top: 4px; font-size: clamp(14px, 1.1vw, 18px); }
    .rejilla .item.episodio .resumen { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 6px 0 0; }
    .rejilla .item.episodio .estrella { right: auto; left: 16px; top: 16px; }
  }
  /* Los episodios, uno debajo de otro (en lista): con el mando ↑ ↓ pasan de uno al siguiente */
  .tele .rejilla.con-episodios { grid-template-columns: minmax(0, 1fr); }
  .tele .rejilla .item.episodio .nombre { font-size: 3vh; }
  .tele .rejilla .item.episodio .meta, .tele .rejilla .item.episodio .resumen { font-size: 2.3vh; }
  /* Tele y móvil: el destacado se adapta */
  .tele .destacado { min-height: 58vh; }
  .tele .destacado h1 { font-size: 6.4vh; } .tele .destacado-sinopsis { font-size: 2.4vh; } .tele .destacado .boton { font-size: 2.4vh; padding: 1.2vh 2.4vw; }

  @media (max-width: 600px) {
    .destacado { min-height: 72vh; align-items: flex-end; }
    .destacado::after { background: linear-gradient(0deg, var(--fondo) 0%, rgba(11,12,16,.75) 35%, rgba(11,12,16,.1) 70%, rgba(11,12,16,.35) 100%); }
    .destacado-texto { padding: 0 16px 34px; text-align: center; margin: 0 auto; }
    .destacado-botones { justify-content: center; }
    .destacado .boton { flex: 1 1 0; justify-content: center; padding: 10px 12px; }
    .destacado-sinopsis { -webkit-line-clamp: 2; }
    .destacado-puntos { left: 0; right: 0; justify-content: center; bottom: 12px; }
    .en-portada header { padding-top: max(10px, env(safe-area-inset-top)); }
    .carrusel .item { width: 31vw; }
    .carrusel.anchas .item, .carrusel .item.episodio { width: 66vw; }
    .carrusel.medios { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .carrusel.medios .cat { aspect-ratio: 4 / 3; }
    #cabecera { margin: -16px -12px 16px; padding: 120px 12px 4px; }
    #cabecera.con-fondo { background-size: auto 260px; background-repeat: no-repeat; }
    .item .nombre { font-size: 12.5px; }
    /* En el móvil los episodios van en fila (imagen a la izquierda): sin ▶ encima */
    .rejilla .item.episodio .mini::after { display: none; }
  }
  /* ================= Estilo plataforma de streaming =================
     Negro profundo, carteles limpios (sin título ni datos técnicos debajo), categorías como
     botones, botones rectos y el color de MorvehTV: el magenta de su logo */
  :root { --fondo: #0a0a0c; --panel: #141418; --panel2: #1c1c22; --borde: #2a2a32; --texto: #f5f5f7; --suave: #a7a7b0; --acento: #e0459b; }
  body { background: var(--fondo); }
  /* Logo: el icono de la nube y la marca con el degradado del icono */
  .logo { font-size: 0; gap: 8px; }
  .logo::before { content: ''; width: clamp(26px, 2.2vw, 34px); height: clamp(26px, 2.2vw, 34px); flex: none; background: url(/icono.svg) center / contain no-repeat; }
  .logo > span:not(#directo) { font-size: clamp(19px, 1.7vw, 26px); font-weight: 900; letter-spacing: -.02em; color: #fff; }
  .logo .tv { color: var(--acento); }
  #bucket { display: none; }
  #directo { font-size: 0; gap: 0; }
  /* Menú: texto claro, el activo en blanco y negrita */
  .pestana, .pestana:hover, .pestana:focus, .pestana.activa { border-bottom-color: transparent; }
  .pestana { color: #c9c9d1; font-size: 14.5px; margin: 0 8px; padding: 6px 2px; transition: color .15s; }
  .pestana:hover, .pestana:focus { color: #fff; }
  .pestana.activa { color: #fff; font-weight: 800; }
  .tele .pestana:focus { background: rgba(255,255,255,.14); border-radius: 6px; }
  .boton { border-radius: 4px; }
  /* Categorías */
  .categorias-chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 clamp(18px, 2.4vw, 34px); }
  .chip-cat { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 999px; padding: 7px 18px;
    font: 600 clamp(13px, 1vw, 15px) system-ui, sans-serif; cursor: pointer; transition: background .15s, color .15s; }
  .chip-cat:hover, .chip-cat:focus { background: #fff; color: #0a0a0c; border-color: #fff; outline: none; }
  .chip-cat:focus { box-shadow: 0 0 0 3px var(--acento); }
  .usa-mando .chip-cat:focus { transform: scale(1.08); }
  /* La cabecera de la portada está fija encima: al moverse con el mando o las flechas, lo
     enfocado se coloca por debajo de ella y no queda tapado */
  html.en-portada { scroll-padding-top: 120px; }
  /* Sin cartel destacado (aún no ha llegado o no hay fichas), las categorías bajan para no
     quedar debajo de la cabecera */
  .destacado[hidden] + .categorias-chips { padding-top: clamp(64px, 9vh, 96px); }
  @media (max-width: 600px) { .destacado[hidden] + .categorias-chips { padding-top: max(96px, calc(env(safe-area-inset-top) + 88px)); } }
  @media (max-width: 600px) { html.en-portada { scroll-padding-top: 100px; } }
  .chip-cat { transition: background .15s, color .15s, transform .15s; }
  .tele .chip-cat { font-size: 2.4vh; padding: 1vh 1.6vw; }
  .tele .chip-cat:focus { transform: scale(1.08); }
  /* Filas */
  .fila-titulo { font-weight: 800; }
  .fila-titulo a:hover, .fila-titulo a:focus { color: #fff; }
  /* Carteles: esquinas pequeñas, sin el botón ▶ redondo; con el ratón crecen, con el mando o
     el teclado llevan un marco blanco */
  .item .mini { border-radius: 4px; box-shadow: none; }
  .item .visto { border-radius: 0 0 4px 4px; }
  .item .mini::after { display: none; }
  .item:hover .mini { box-shadow: 0 10px 28px rgba(0,0,0,.65); }
  .item:focus .mini { box-shadow: 0 0 0 3px #fff, 0 10px 28px rgba(0,0,0,.65); }
  .carrusel:not(.anchas) .item.con-imagen:not(.episodio) .nombre, .carrusel:not(.anchas) .item.con-imagen:not(.episodio) .meta,
  .carrusel:not(.anchas) .item.con-imagen:not(.episodio) .resumen,
  .rejilla .item.con-imagen:not(.episodio) .nombre, .rejilla .item.con-imagen:not(.episodio) .meta, .rejilla .item.con-imagen:not(.episodio) .resumen { display: none; }
  .item .nombre { font-weight: 600; }
  .item .nuevo { top: auto; bottom: 0; left: 50%; transform: translateX(-50%); border-radius: 3px 3px 0 0; font-size: 10.5px; letter-spacing: .06em; padding: 2px 8px; box-shadow: none; }
  @media (hover: hover) and (pointer: fine) {
    .rejilla .item:not(.episodio) { transition: transform .22s ease; }
    .rejilla .item:not(.episodio):hover { transform: scale(1.05); z-index: 2; }
  }
  /* Al entrar en una categoría: solo su nombre, grande */
  .biblioteca { border-bottom: 0; padding: 4px 0 10px; }
  .biblioteca-icono, .biblioteca-cuenta { display: none; }
  .biblioteca h1 { font-size: clamp(28px, 3.2vw, 52px); font-weight: 900; letter-spacing: -.01em; }
  .tele .biblioteca h1 { font-size: 5.4vh; }
  /* Botones de reproducir: blancos y rectos; los demás, grises translúcidos */
  .boton.reproducir { background: #fff; border-color: #fff; color: #0a0a0c; border-radius: 4px; font-weight: 800; }
  .boton.reproducir:hover, .boton.reproducir:focus { background: rgba(255,255,255,.8); border-color: rgba(255,255,255,.8); }
  .boton.reproducir:focus, .destacado .boton:focus, #cabecera .boton:focus { outline: 3px solid var(--acento); outline-offset: 2px; }
  #cabecera .boton:not(.reproducir) { background: rgba(110,110,120,.5); border-color: transparent; border-radius: 4px; }
  .destacado .boton { border-radius: 4px; }
  .destacado-etiqueta { color: #fff; display: inline-flex; align-items: center; gap: 8px; }
  .destacado-etiqueta::before { content: ''; width: 4px; height: 1.2em; border-radius: 2px; background: var(--acento); }
  /* Ruta de carpetas: texto discreto, la carpeta actual en blanco */
  #migas a, #migas .actual { background: none; border-color: transparent; padding-left: 2px; padding-right: 2px; color: var(--suave); }
  #migas a:hover { color: #fff; border-color: transparent; }
  #migas .actual { background: none; border-color: transparent; color: #fff; }
  /* Ficha de la serie: con fondo grande, sin el póster al lado */
  #cabecera.con-fondo .ficha img.cartel { display: none; }
  #cabecera .ficha h2 { font-weight: 900; }
  #cabecera .chip { border-radius: 4px; }
  @media (max-width: 600px) {
    /* En el móvil, todas a la vista (en varias líneas) y fáciles de tocar */
    .categorias-chips { gap: 8px; }
    .chip-cat { padding: 8px 14px; font-size: 13.5px; min-height: 38px; }
  }
  /* «Seguir viendo» y «Favoritos» (pestañas de arriba): título grande y, en «Seguir viendo»,
     tarjetas apaisadas con el título y la barra de lo visto, como en la fila del inicio */
  .rejilla.anchas, .rejilla.anchas.con-episodios { grid-template-columns: repeat(auto-fill, minmax(clamp(220px, 19vw, 330px), 1fr)); }
  .tele .rejilla.anchas, .tele .rejilla.anchas.con-episodios { grid-template-columns: repeat(auto-fill, minmax(26vw, 1fr)); gap: 3vh 1.8vw; }
  .rejilla.anchas .item.con-imagen:not(.episodio) .nombre { display: -webkit-box; }
  .rejilla.anchas .item.con-imagen:not(.episodio) .meta { display: block; }
  .rejilla.anchas .item .resumen { display: none; }
  .rejilla.anchas .item .nombre, .rejilla.anchas .item .meta { text-align: left; }
  /* Los episodios, como tarjeta igual que las demás (no en lista), también en el móvil */
  .rejilla.anchas .item.episodio { display: flex; flex-direction: column; padding: 0; background: none; border-radius: 0; }
  .rejilla.anchas .item.episodio:hover, .rejilla.anchas .item.episodio:focus { background: none; }
  .rejilla.anchas .item.episodio .mini { aspect-ratio: 16 / 9; min-height: 0; align-self: auto; }
  .rejilla.anchas .item.episodio .nombre { padding-top: 8px; font-size: 13.5px; }
  .rejilla.anchas .item.episodio .estrella { left: auto; right: 6px; top: 6px; }
  .tele .rejilla.anchas .item .nombre { font-size: 2.9vh; }
  .tele .rejilla.anchas .item .meta { font-size: 2.3vh; }
  @media (max-width: 600px) { .rejilla.anchas, .rejilla.anchas.con-episodios { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }

  /* ---------- Reproductor estilo plataforma de streaming ----------
     Arriba, la barra de progreso a lo ancho (fina, con lo visto en color y el tiempo a la
     derecha); debajo, iconos grandes sin recuadro: ▶ ⟲10 10⟳ 🔊 a la izquierda y capítulos,
     idioma y pantalla completa a la derecha. A pantalla completa todo flota sobre la imagen con
     un degradado oscuro y se esconde solo. */
  .controles { flex-wrap: wrap; gap: 4px 6px; padding: 10px 14px 12px; }
  .controles .fila-progreso { order: -1; flex: 1 1 100%; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .controles .fila-progreso input[type=range] { order: 0; flex: 1 1 auto; min-width: 0; margin: 0; }
  .controles .fila-progreso .tiempo { order: 0; flex: none; font-size: 14px; text-align: right; margin: 0; }
  .controles .grupo { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .controles .grupo.der { margin-left: auto; }
  .controles .grupo .boton { background: transparent; border-color: transparent; color: #fff; border-radius: 999px; padding: 8px 10px; min-width: 0;
    display: inline-flex; align-items: center; gap: 6px; transition: transform .15s, background .15s; }
  .controles .grupo .boton .icono { width: 26px; height: 26px; }
  .controles .grupo .boton span { font-size: 13px; font-weight: 700; }
  .controles .grupo .boton:hover, .controles .grupo .boton:focus { background: rgba(255,255,255,.14); transform: scale(1.12); outline: none; }
  .controles .grupo .boton:focus-visible, .usa-mando .controles .grupo .boton:focus, .tele .controles .grupo .boton:focus { box-shadow: 0 0 0 2px #fff; }
  .controles .grupo .boton.audio span, .controles .grupo .boton.con-texto span { font-size: 14px; max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* La barra de progreso: fina, con lo recorrido en el color de la web; crece al pasar por ella */
  .controles input[type=range] { -webkit-appearance: none; appearance: none; height: 18px; background: transparent; cursor: pointer; }
  .controles input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; transition: height .15s;
    background: linear-gradient(to right, var(--acento) var(--pct, 0%), rgba(255,255,255,.3) var(--pct, 0%)); }
  .controles input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.3); }
  .controles input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--acento); }
  .controles input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%;
    background: var(--acento); border: 0; box-shadow: 0 0 0 3px rgba(224,69,155,.25); transform: scale(.9); transition: transform .15s; }
  .controles input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--acento); border: 0; }
  .controles input[type=range]:hover::-webkit-slider-runnable-track { height: 6px; }
  .controles input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.25); margin-top: -4px; }
  /* A pantalla completa: sin fondo de panel, solo el degradado sobre la imagen */
  #visor.cine .controles { background: linear-gradient(transparent, rgba(0,0,0,.55) 40%, rgba(0,0,0,.9)); padding-top: 70px; gap: 6px 8px; }
  #visor.cine .controles .grupo .boton { background: transparent; border-color: transparent; }
  #visor.cine .controles .grupo .boton:hover, #visor.cine .controles .grupo .boton:focus { background: rgba(255,255,255,.14); }
  #visor.cine .controles .grupo .boton .icono { width: 30px; height: 30px; }
  #visor.cine .controles .fila-progreso .tiempo { color: #fff; font-size: 15px; }
  #visor.cine .barra { background: linear-gradient(rgba(0,0,0,.75), transparent); padding-bottom: 50px; }
  #visor.cine #salircine { background: transparent; border-color: transparent; font-size: 18px; font-weight: 700; }
  #visor.cine #vtitulo { font-size: 18px; font-weight: 700; }
  /* La lista de idiomas sale encima del botón, a la derecha */
  .menu-audio { left: auto; right: 10px; }
  #visor.cine .menu-audio { right: max(16px, env(safe-area-inset-right)); bottom: calc(110px + env(safe-area-inset-bottom)); }
  /* ▶ grande del centro (en pausa): limpio, sin borde de color */
  #visor.cine .gran-play { background: rgba(0,0,0,.45); border-color: rgba(255,255,255,.9); }
  #visor.cine .gran-play:hover, #visor.cine .gran-play:focus { background: rgba(255,255,255,.22); }
  /* Tele: iconos grandes para verlos desde el sofá */
  .tele .controles .grupo .boton { padding: 1.2vh 1.1vw; font-size: 2.4vh; }
  .tele .controles .grupo .boton .icono, .tele #visor.cine .controles .grupo .boton .icono { width: 4.6vh; height: 4.6vh; }
  .tele .controles .grupo .boton span { font-size: 2.4vh; }
  .tele .controles .fila-progreso .tiempo { font-size: 2.6vh; }
  .tele .controles input[type=range]::-webkit-slider-runnable-track { height: 6px; }
  .tele #visor.cine .controles { padding: 12vh 4vw 4vh; }
  .tele #visor.cine #vtitulo { font-size: 3.2vh; }
  /* Móvil: iconos algo menores y, en muy estrecho, sin los textos (solo iconos) */
  @media (max-width: 700px) {
    .controles .grupo .boton { padding: 6px 7px; }
    .controles .grupo .boton .icono, #visor.cine .controles .grupo .boton .icono { width: 24px; height: 24px; }
    .controles .fila-progreso .tiempo { font-size: 12px; }
  }
  @media (max-width: 480px) {
    .controles .grupo .boton span { display: none; }
    .controles .grupo .boton.audio span { display: none; }
  }
</style>
