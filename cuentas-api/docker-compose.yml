# MorvehTV Cuentas en la VPS. Lo arranca instalar.sh y lo actualiza actualizar.sh.
services:
  cuentas:
    build: .
    image: morvehtv-cuentas
    container_name: morvehtv-cuentas
    restart: unless-stopped
    # Red de la propia máquina: llega a Emby en 127.0.0.1:8096 y escucha solo en 127.0.0.1:10100
    # (el que da la cara a internet es Caddy, en panel.morvehtv.com)
    network_mode: host
    # EMBY_URL y EMBY_API_KEY: fuera del repositorio, solo los puede leer root
    env_file: /etc/morvehtv-cuentas/cuentas.env
    environment:
      HOST: 127.0.0.1
      PUERTO: "10100"
    volumes:
      - /var/lib/morvehtv-cuentas:/datos
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10100/api/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: local
      options: { max-size: "5m", max-file: "3" }
