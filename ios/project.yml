# App de MorvehTV para iPhone e iPad. No hace falta Mac: GitHub Actions genera el proyecto de
# Xcode con XcodeGen a partir de este archivo, lo compila y (con la cuenta de Apple configurada en
# los secretos del repositorio) lo sube a TestFlight. Ver .github/workflows/ios.yml
name: MorvehTV
options:
  bundleIdPrefix: es.morvehtv
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MorvehTV:
    type: application
    platform: iOS
    sources:
      - path: MorvehTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.morvehtv.visor
        PRODUCT_NAME: MorvehTV
        INFOPLIST_FILE: MorvehTV/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # La dirección de la web que abre la app
        SERVIDOR: https://morvehtv.com
schemes:
  MorvehTV:
    build:
      targets:
        MorvehTV: all
    archive:
      config: Release
